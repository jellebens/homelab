- name: Wait for API
  command: kubectl --kubeconfig {{kubeconfig_path}} get nodes
  delegate_to: localhost
  register: api_check
  retries: 3
  delay: 10
  until: api_check.rc == 0
  changed_when: false
  failed_when: api_check.rc != 0 and api_check.attempts | default(1) >= 20

- name: Verify nodes Ready
  shell: |
    kubectl get nodes --kubeconfig {{kubeconfig_path}} --no-headers | awk '{print $2}'
  register: node_states
  changed_when: false
  delegate_to: localhost

- name: Fail if node not ready
  fail:
    msg: "Cluster nodes not Ready"
  when: "'NotReady' in node_states.stdout"

- name: Get kube-system pods
  delegate_to: localhost
  command: kubectl get pods -n kube-system --kubeconfig {{kubeconfig_path}} -o json
  register: system_pods
  changed_when: false

- name: Find unhealthy pods
  set_fact:
    unhealthy_pods: >-
      {{
        system_pods.stdout | from_json
        | json_query(
          "items[?status.phase!='Running' || status.containerStatuses[?ready==`false`]].metadata.name"
        )
      }}

- name: Fail if kube-system pods unhealthy
  fail:
    msg: "Unhealthy kube-system pods detected: {{ unhealthy_pods }}"
  when: unhealthy_pods | length > 0
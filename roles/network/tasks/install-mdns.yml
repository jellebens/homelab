- name: Gather network information
  ansible.builtin.setup:
    gather_subset:
      - network

- name: Validate networking variables
  ansible.builtin.assert:
    that:
      - static_interface is defined
      - static_ip is defined
      - ansible_facts['' ~ wireless_interface] is defined
    fail_msg: >
      Missing networking vars for {{ inventory_hostname }}.
      Expected: static_interface, static_ip, wireless_interface

- name: Install avahi packages
  become: true
  ansible.builtin.apt:
    name:
      - avahi-daemon
      - avahi-utils
    state: present
    update_cache: true

- name: Configure avahi-daemon
  become: true
  ansible.builtin.copy:
    dest: /etc/avahi/avahi-daemon.conf
    mode: "0644"
    content: |
      [server]
      host-name={{ inventory_hostname_short }}
      domain-name=local
      allow-interfaces=wlan0
      use-ipv4=yes
      use-ipv6=no

      [publish]
      publish-addresses=yes
      publish-hinfo=yes
      publish-workstation=yes
  notify: Restart avahi

- name: Publish wifi.{{ inventory_hostname_short }}.local to {{ ansible_facts[''~ wireless_interface]['device'] }} IP
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/wifi-mdns.service
    mode: "0644"
    content: |
      [Unit]
      Description=Publish wifi.{{ inventory_hostname }} via mDNS on {{ ansible_facts[''~ wireless_interface]['device'] }}
      After=network-online.target avahi-daemon.service
      Wants=network-online.target
      Requires=avahi-daemon.service

      [Service]
      Type=simple
      ExecStart=/usr/bin/avahi-publish-address -R wifi.{{ inventory_hostname }} {{ ansible_facts['' ~ wireless_interface]['ipv4']['address'] }}
      Restart=on-failure
      RestartSec=2

      [Install]
      WantedBy=multi-user.target
  when: 
    - ansible_facts['' ~ wireless_interface] is defined
    - ansible_facts['' ~ wireless_interface]['ipv4'] is defined
    - ansible_facts['' ~ wireless_interface]['ipv4']['address'] is defined
  notify:
    - Systemd daemon-reload
    - Restart wifi-mdns

- name: Publish lan.{{ inventory_hostname }}.local to {{ static_interface }} IP
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/lan-mdns.service
    mode: "0644"
    content: |
      [Unit]
      Description=Publish lan.{{ inventory_hostname }}.local via mDNS on eth0
      After=network-online.target avahi-daemon.service
      Wants=network-online.target
      Requires=avahi-daemon.service

      [Service]
      Type=simple
      ExecStart=/usr/bin/avahi-publish-address -R lan.{{ inventory_hostname }} {{ static_ip }}
      Restart=on-failure
      RestartSec=2

      [Install]
      WantedBy=multi-user.target
  when: static_ip is defined
  notify:
    - Systemd daemon-reload
    - Restart lan-mdns

- name: Enable and start lan mDNS publisher
  become: true
  ansible.builtin.systemd:
    name: lan-mdns.service
    enabled: true
    state: started

- name: Enable and start wifi mDNS publisher
  become: true  
  ansible.builtin.systemd:
    name: wifi-mdns.service
    enabled: true
    state: started
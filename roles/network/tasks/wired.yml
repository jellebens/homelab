---
- name: Validate networking variables
  ansible.builtin.assert:
    that:
      - static_interface is defined
    fail_msg: >
      Missing networking vars for {{ inventory_hostname }}.
      Expected: static_interface

- name: Verify NetworkManager is running
  ansible.builtin.systemd:
    name: NetworkManager
    state: started
  ignore_errors: false

- name: Get connection name for {{ static_interface }}
  ansible.builtin.command: nmcli -t -f NAME,DEVICE connection show
  register: nm_connections
  become: true

- name: Parse connection name
  ansible.builtin.set_fact:
    nm_connection_name: "{{ item.split(':')[0] }}"
  with_items: "{{ nm_connections.stdout_lines }}"
  when: item.split(':')[1] == static_interface


- name: Set DNS servers on NetworkManager connection
  ansible.builtin.command: >
    nmcli connection modify "{{ nm_connection_name }}"
    ipv4.dns "192.168.50.144 192.168.50.1 1.1.1.1"
    ipv4.ignore-auto-dns yes
    ipv4.method auto
  register: nm_modify
  become: true
  changed_when: true

- name: Set DNS search domain on NetworkManager connection
  ansible.builtin.command: >
    nmcli connection modify "{{ nm_connection_name }}"
    ipv4.dns-search "local"
  become: true
  changed_when: true

# The wired connection must be pure DHCP (ipv4.method auto). Earlier provisioning
# left a manual ipv4.addresses (e.g. 192.168.50.16x/24) on some nodes, so eth0
# came up with BOTH the static .16x (primary) and the DHCP-reserved .15x
# (secondary) — and k3s auto-detected the wrong (.16x) IP as its node InternalIP.
# Clear any manual address/gateway so only the DHCP reservation remains.
- name: Clear stale manual IPv4 address/gateway on the wired connection
  ansible.builtin.command: >
    nmcli connection modify "{{ nm_connection_name }}"
    ipv4.addresses ""
    ipv4.gateway ""
  become: true
  changed_when: true

- name: Reboot to apply networking changes
  ansible.builtin.reboot:
    reboot_timeout: 300        
    connect_timeout: 10
    post_reboot_delay: 5       
    pre_reboot_delay: 3        
    msg: "Ansible-triggered reboot"
    test_command: "whoami"
  become: true

- name: Verify the Pi is back online
  ansible.builtin.ping:
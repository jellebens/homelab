---
- name: Validate networking variables
  ansible.builtin.assert:
    that:
      - static.interface is defined
      - static.ip is defined
      - static.prefix is defined
      - static.gateway is defined
      - static.dns is defined
    fail_msg: >
      Missing networking vars for {{ inventory_hostname }}.
      Expected: static.interface, static.ip, static.prefix, static.gateway, static.dns
      
- name: Verify NetworkManager is running
  ansible.builtin.systemd:
    name: NetworkManager
    state: started
  ignore_errors: false

- name: Get connection name for {{ static.interface }}
  ansible.builtin.command: nmcli -t -f NAME,DEVICE connection show
  register: nm_connections
  become: true

- name: Parse connection name
  ansible.builtin.set_fact:
    nm_connection_name: "{{ item.split(':')[0] }}"
  with_items: "{{ nm_connections.stdout_lines }}"
  when: item.split(':')[1] == static.interface

- name: Configure static IP on {{ static_interface }}
  ansible.builtin.command: >
    nmcli connection modify "{{ nm_connection_name }}"
    ipv4.addresses {{ static.ip }}/{{ static.prefix }}
    ipv4.gateway {{ static.gateway }}
    ipv4.dns "{{ static.dns | join(' ') }}"
    ipv4.method manual
    connection.autoconnect yes
  register: nm_modify
  become: true

- name: Reboot {{ inventory_hostname_short }} to apply networking changes
  ansible.builtin.reboot:
    reboot_timeout: 300        
    connect_timeout: 10
    post_reboot_delay: 5       
    pre_reboot_delay: 3        
    msg: "Ansible-triggered reboot"
    test_command: "whoami"
  become: true

- name: Verify the Pi is back online
  ansible.builtin.ping:

- name: Show resulting IP
  ansible.builtin.command: ip -4 addr show "{{ static_interface }}"
  register: out
  changed_when: false

- debug:
    msg: "{{ out.stdout_lines }}"
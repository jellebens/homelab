---
- name: Ensure config directory exists
  become: true
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Set bootstrap facts
  ansible.builtin.set_fact:
    k3s_is_init_node: "{{ inventory_hostname == groups['masters'][0] }}"
    k3s_primary_server_ip: "{{ hostvars[groups['masters'][0]].ansible_host | default(groups['masters'][0]) }}"

- name: Write config for initial server
  become: true
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
    content: |
      write-kubeconfig-mode: "644"
      cluster-init: true
      token: "{{ k3s_token }}"
      flannel-backend: "none"
      disable-network-policy: true
      disable-kube-proxy: true
      disable:
        - servicelb
        - traefik
      tls-san:
        - "{{ inventory_hostname }}"
      node-name: "{{ inventory_hostname }}"
  when: k3s_is_init_node

- name: Write config for joining servers
  become: true
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
    content: |
      write-kubeconfig-mode: "644"
      server: "https://{{ hostvars[groups['masters'][0]].ansible_host | default(groups['masters'][0]) }}:{{ k3s_port }}"
      token: "{{ hostvars[groups['masters'][0]].k3s_token }}"
      flannel-backend: "none"
      disable-network-policy: true
      disable-kube-proxy: true
      supervisor-metrics: true
      disable:
        - servicelb
        - traefik
      tls-san:
        - "{{ ansible_host }}"
      node-name: "{{ inventory_hostname }}"
  when: not k3s_is_init_node

- name: Restart service if config changed
  become: true
  ansible.builtin.systemd:
    name: k3s
    state: restarted
    enabled: true
    daemon_reload: true

- name: Flush handlers so restart happens immediately
  ansible.builtin.meta: flush_handlers
---
- name: Validate networking variables
  ansible.builtin.assert:
    that:
      - k3s_version is defined
    fail_msg: >
      Missing vars for {{ inventory_hostname }}.
      Expected: k3s_version

- name: Check if k3s server uninstall script exists
  ansible.builtin.stat:
    path: /usr/local/bin/k3s-uninstall.sh
  register: k3s_server_uninstall

- name: Uninstall k3s server if installed
  become: true
  ansible.builtin.command: /usr/local/bin/k3s-uninstall.sh
  when: k3s_server_uninstall.stat.exists

- name: Install k3s master
  become: true
  shell: curl -sfL https://get.k3s.io | sh -
  args:
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: >
      server
      --cluster-init
      --tls-san {{ ansible_host }}
      --node-name {{ inventory_hostname }}

- name: Wait for node-token file to appear
  become: true
  ansible.builtin.shell: test -f /var/lib/rancher/k3s/server/node-token
  register: token_file
  retries: 30          # try for up to 5 minutes (30 * 10s)
  delay: 10
  until: token_file.rc == 0

- name: Read K3S node token
  become: true
  ansible.builtin.command: cat /var/lib/rancher/k3s/server/node-token
  register: k3s_token
  failed_when: k3s_token.rc != 0 or k3s_token.stdout is undefined
  changed_when: false

- name: Set K3S_TOKEN as a fact
  set_fact:
    k3s_token: "{{ k3s_token.stdout | trim }}"
- name: The inventory must say which gitops environment this cluster is
  ansible.builtin.assert:
    that:
      - gitops_environment is defined
      - gitops_environment is string
      - gitops_environment | length > 0
    fail_msg: >
      Set gitops_environment (e.g. "lab") in the inventory group_vars: it selects
      gitops .config/<gitops_environment>/values.yaml. Do not call it "environment",
      that is a reserved Ansible keyword.

- name: Clone Helm chart repo
  delegate_to: localhost
  ansible.builtin.git:
    repo: https://github.com/jellebens/gitops.git
    dest: /tmp/gitops
    version: master # gitops deploys from master (GitFlow since 2026-07-02); there is no main
    force: true

- name: Install Helm chart from Git repo
  delegate_to: localhost
  kubernetes.core.helm:
    name: argocd-bootstrap
    chart_ref: /tmp/gitops/bootstrap
    release_namespace: argocd
    create_namespace: true
    values_files:
      - /tmp/gitops/.config/shared/values.yaml
      - /tmp/gitops/.config/{{ gitops_environment }}/values.yaml
    kubeconfig: "{{ kubeconfig }}"
    wait: true

- name: Clean up cloned repo
  delegate_to: localhost
  ansible.builtin.file:
    path: /tmp/gitops
    state: absent
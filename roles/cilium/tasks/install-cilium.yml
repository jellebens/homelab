---
- name: Check if kubeconfig exists
  delegate_to: localhost
  ansible.builtin.stat:
    path: "{{ kubeconfig }}"
  register: kubeconfig_present

- name: Test
  ansible.builtin.debug:
    msg: "Kubeconfig exists: {{ kubeconfig_present.stat.exists }} - {{ kubeconfig }}"

- name: Create kubeconfig
  ansible.builtin.include_role:
    name: k3s
  when: not kubeconfig_present.stat.exists

- name: Install Cilium
  delegate_to: localhost
  kubernetes.core.helm:
    name: cilium
    chart_ref: oci://quay.io/cilium/charts/cilium
    release_namespace: kube-system
    create_namespace: true
    kubeconfig: "{{ kubeconfig }}"
    values: "{{ lookup('template', role_path + '/templates/cilium-values.yml.j2') | from_yaml }}"
    wait: true
    wait_timeout: 10m
      
- name: Wait for Cilium pods
  delegate_to: localhost
  ansible.builtin.command: >
    kubectl -n kube-system rollout status ds/cilium --timeout=300s
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: cilium_ds
  changed_when: false

- name: Wait for Cilium operator
  delegate_to: localhost
  ansible.builtin.command: >
    kubectl -n kube-system rollout status deploy/cilium-operator --timeout=300s
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: cilium_operator
  changed_when: false

# k3s ships the cluster CoreDNS (kube-dns) with a single replica (the bundled
# manifest omits `replicas`, so scaling it here persists and is not reverted by
# the k3s deploy controller). Run 3 for HA — a single DNS pod was a SPOF when its
# node got isolated. CoreDNS already has topologySpreadConstraints, so the
# replicas spread one-per-node automatically. Done after the CNI is up so the
# new pods can schedule.
- name: Scale cluster CoreDNS (kube-dns) to 3 replicas for HA
  delegate_to: localhost
  kubernetes.core.k8s_scale:
    api_version: apps/v1
    kind: Deployment
    name: coredns
    namespace: kube-system
    replicas: 3
    kubeconfig: "{{ kubeconfig }}"
    wait: true
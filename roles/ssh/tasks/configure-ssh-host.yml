#Preparing target 
- name: Ensure SSH user exists 
  ansible.builtin.user:
    name: "{{ ssh_user }}"
    shell: /bin/bash
    groups: "{{ ssh_user_groups }}"
    append: true
    create_home: true

- name: Install SSH public key for user (like ssh-copy-id)
  ansible.posix.authorized_key:
    user: "{{ ssh_user }}"
    state: present
    manage_dir: true
    key: "{{ lookup('file', local_pubkey_path | expanduser) }}"

- name: Ensure SSH hardening override
  become: true
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root
    group: root
    mode: "0600"
    content: |
      Match all
      PasswordAuthentication no
      PermitRootLogin no
  notify: Restart SSH service

- name: Optionally disable SSH password authentication
  become: true
  ansible.builtin.lineinfile:
    path: "/etc/ssh/sshd_config.d/99-hardening.conf"
    regexp: '^#?PasswordAuthentication\s+'
    line: 'PasswordAuthentication no'
    state: present
    backup: yes
  when: (ssh.disable_password_login | default(disable_password_login, true))
  notify: Restart SSH service

- name: Optionally disable root login over SSH
  become: true
  ansible.builtin.lineinfile:
    path: "/etc/ssh/sshd_config.d/99-hardening.conf"
    regexp: '^#?PermitRootLogin\s+'
    line: 'PermitRootLogin no'
    state: present
    backup: yes
  when: (ssh.disable_root | default(disable_root_ssh, true))
  notify: Restart SSH service

- name: Ensure PubkeyAuthentication is enabled
  become: true
  ansible.builtin.lineinfile:
    path: "{{ sshd_config_path }}"
    regexp: '^#?PubkeyAuthentication\s+'
    line: 'PubkeyAuthentication yes'
    state: present
    backup: yes
  notify: Restart SSH service

- name: Verify effective sshd settings
  become: true
  ansible.builtin.command: sshd -T
  register: sshd_effective
  changed_when: false

- name: Show effective sshd settings
  ansible.builtin.debug:
    msg: "{{ sshd_effective.stdout_lines | select('match', '^(passwordauthentication|permitrootlogin|pubkeyauthentication) ') | list }}"

- name: Assert SSH succeeds with publickey only (no password fallback)
  ansible.builtin.command: >-
    ssh
    -p {{ ansible_port | default(22) }}
    -o BatchMode=yes
    -o PreferredAuthentications=publickey
    -o PubkeyAuthentication=yes
    -o PasswordAuthentication=no
    -o KbdInteractiveAuthentication=no
    -o ChallengeResponseAuthentication=no
    -o NumberOfPasswordPrompts=0
    -o ConnectTimeout=8
    {% if local_key_path | length > 0 %}-i {{ local_key_path }}{% endif %}
    {{ ssh_user }}@{{ inventory_hostname }}
    true
  register: key_only_probe
  changed_when: false
  delegate_to: localhost

- name: Fail if key-only probe fails
  ansible.builtin.fail:
    msg: >-
      Key-only SSH assertion FAILED for {{ inventory_hostname }}.
      This means public-key authentication is not working, or SSH would require/fallback to password.
      ssh exit={{ key_only_probe.rc }}
      stderr={{ key_only_probe.stderr | default('') }}
  when: key_only_probe.rc != 0

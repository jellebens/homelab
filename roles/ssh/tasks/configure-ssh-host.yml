---
- name: Validate variables
  ansible.builtin.assert:
    that:
      - ssh_user_groups is defined
      - ansible_ssh_user is defined
      - ssh_local_key_path is defined
      - ssh_local_pubkey_path is defined
      - sshd_config_path is defined
    fail_msg: >
      Missing networking vars for {{ inventory_hostname }}. \r\n
      Expected: ssh_user, ssh_user.name, ssh_user_groups, ssh_local_key_path, ssh_local_pubkey_path, sshd_config_path


- name: Ensure SSH user exists 
  become: true
  ansible.builtin.user:
    name: "{{ ansible_ssh_user }}"
    shell: /bin/bash
    groups: "{{ ssh_user_groups }}"
    append: true
    create_home: true

- name: Install SSH public key for user (like ssh-copy-id)
  become: true
  ansible.posix.authorized_key:
    user: "{{ ansible_ssh_user }}"
    state: present
    manage_dir: true
    key: "{{ lookup('file', ssh_local_pubkey_path | expanduser) }}"

- name: Ensure SSH hardening override
  become: true
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root
    group: root
    mode: "0600"
    content: |
      PasswordAuthentication no
      PermitRootLogin no
      PubkeyAuthentication yes
  notify: Restart SSH service

- name: Optionally disable SSH password authentication
  become: true
  ansible.builtin.lineinfile:
    path: "/etc/ssh/sshd_config.d/99-hardening.conf"
    regexp: '^#?PasswordAuthentication\s+'
    line: 'PasswordAuthentication no'
    state: present
    backup: yes
  when: (ssh_disable_password_login | default(true) | bool)
  notify: Restart SSH service

- name: Optionally disable root login over SSH
  become: true
  ansible.builtin.lineinfile:
    path: "/etc/ssh/sshd_config.d/99-hardening.conf"
    regexp: '^#?PermitRootLogin\s+'
    line: 'PermitRootLogin no'
    state: present
    backup: yes
  when: (ssh_disable_root_login | default(true) | bool)
  notify: Restart SSH service

- name: Ensure PubkeyAuthentication is enabled
  become: true
  ansible.builtin.lineinfile:
    path: "{{ sshd_config_path }}"
    regexp: '^#?PubkeyAuthentication\s+'
    line: 'PubkeyAuthentication yes'
    state: present
    backup: yes
  notify: Restart SSH service

- name: Verify effective sshd settings (incl Match)
  become: true
  ansible.builtin.command: >-
    sshd -T
    -C user={{ ansible_ssh_user }}
    -C host={{ inventory_hostname }}
  register: sshd_effective
  changed_when: false

- name: Show effective sshd settings
  ansible.builtin.debug:
    msg: "{{ sshd_effective.stdout_lines | select('match', '^(passwordauthentication|permitrootlogin|pubkeyauthentication) ') | list }}"

- name: Assert SSH succeeds with publickey only (no password fallback)
  become: false #prevents “oops I’m root on localhost”
  ansible.builtin.command: >-
    ssh
    -p {{ ansible_port | default(22) }}
    -o BatchMode=yes
    -o PreferredAuthentications=publickey
    -o PubkeyAuthentication=yes
    -o PasswordAuthentication=no
    -o KbdInteractiveAuthentication=no
    -o ChallengeResponseAuthentication=no
    -o NumberOfPasswordPrompts=0
    -o ConnectTimeout=8
    -o StrictHostKeyChecking=accept-new
    -o UserKnownHostsFile={{ ansible_env.HOME }}/.ssh/known_hosts
    -i {{ ssh_local_key_path | expanduser }}
    {{ ansible_ssh_user }}@{{ inventory_hostname }}
    true
  register: key_only_probe
  changed_when: false
  delegate_to: localhost
  environment:
    HOME: "{{ ansible_env.HOME }}"

- name: Fail if key-only probe fails
  ansible.builtin.fail:
    msg: >-
      Key-only SSH assertion FAILED for {{ inventory_hostname }}.
      This means public-key authentication is not working, or SSH would require/fallback to password.
      ssh exit={{ key_only_probe.rc }}
      stderr={{ key_only_probe.stderr | default('') }}
  when: key_only_probe.rc != 0

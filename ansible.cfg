[defaults]
inventory = inventories/shared, inventories/lab
roles_path = roles
#host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml
interpreter_python = auto_silent
[ssh_connection]
# The lab resolves *.local by mDNS/DNS over a flaky wireless backhaul; a first
# lookup from inside the execution environment now and then fails. Retry the
# connection before declaring a host unreachable (upgrade_k3s.yml, 2026-10-22).
retries = 5
